name: Publish Development Build
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build 1.21 targets
        run: |
          for version in 1.21.4 1.21.5 1.21.8 1.21.11; do
            ./gradlew build -Pminecraft_version="$version"
          done

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Build 26.1 target
        run: |
          bash versions/26.1/gradlew -p versions/26.1 build
          cp versions/26.1/build/libs/tim-*+mc26.1.jar build/libs/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: snapshot
          name: Dev Build
          prerelease: true
          files: |
            ./build/libs/*.jar
